trainer:
  max_epochs: 50
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    class_weights_path: rooftop_class_weights.json
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [400, 800, 1200, 1600]
    attn_mask_annealing_end_steps: [800, 1200, 1600, 2000]
    ckpt_path: eomt-epoch=015.ckpt
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 150
        encoder:
          class_path: models.vit.ViT
data:
  class_path: datasets.gradual_resolution_erp.GradualResolutionERP
  init_args:
    final_img_size: [512, 1024]
    batch_size: 4
    num_workers: 2
    color_jitter_enabled: true
    scale_range: [0.8, 1.2]
    erp_augmentation_factor: 20
    phase_epochs: [10, 20, 20]
